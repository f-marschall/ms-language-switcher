name: Build browser extensions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP packages
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          manifest = json.loads(Path("manifest.json").read_text())
          rules = Path("rules.json")
          json.loads(rules.read_text())
          out = Path("dist")
          out.mkdir(exist_ok=True)
          for browser in ("chromium", "firefox"):
              config = dict(manifest)
              if browser == "firefox":
                  config["browser_specific_settings"] = {
                      "gecko": {
                          "id": "learn-in-english@f-marschall",
                          "strict_min_version": "140.0",
                          "data_collection_permissions": {"required": ["none"]}
                      }
                  }
              else:
                  config.pop("browser_specific_settings", None)
              icon = Path("assets/logo-128.png")
              if icon.is_file() and not config.get("icons"):
                  config["icons"] = {"128": icon.as_posix()}
              with ZipFile(out / f"learn-in-english-{browser}.zip", "w", ZIP_DEFLATED) as z:
                  z.writestr("manifest.json", json.dumps(config, indent=2) + "\n")
                  z.write(rules, rules.as_posix())
                  for path in sorted(set(config.get("icons", {}).values())):
                      z.write(path, path)
          PY
      - name: Upload Chromium package
        uses: actions/upload-artifact@v4
        with:
          name: chromium
          path: dist/learn-in-english-chromium.zip
          if-no-files-found: error
      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox
          path: dist/learn-in-english-firefox.zip
          if-no-files-found: error
